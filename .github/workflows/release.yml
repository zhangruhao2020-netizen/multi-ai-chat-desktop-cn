# Adapted from refs/better-agent-terminal/.github/workflows/release.yml (MIT).
# M6 intentionally drops sidecar, Chocolatey, Homebrew, updater-manifest, and
# lightweight-machine logic. This workflow only reacts to manually pushed v* tags.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  # The SignPath action reads the uploaded unsigned artifact back through
  # the GitHub API, which needs actions: read on top of contents: read.
  actions: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: windows
          - os: macos-latest
            platform: macos
            artifact: macos
          - os: ubuntu-latest
            platform: linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16

      - name: Install Linux WebKitGTK build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build injected scripts
        run: pnpm build:injected

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          if [[ -z "$version" || "$version" == "$RELEASE_TAG" ]]; then
            echo "Release tag must start with v and include a version, got: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-pre(\.[0-9A-Za-z-]+)?)?$ ]]; then
            echo "Release version must be X.Y.Z or X.Y.Z-pre[.N] (only -pre prereleases are supported, matching the prerelease flag), got: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Inject release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const fs = require('fs'); for (const file of ['package.json', 'src-tauri/tauri.conf.json']) { const data = JSON.parse(fs.readFileSync(file, 'utf8')); data.version = process.env.VERSION; fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n'); }"

      - name: Verify (typecheck + lint + tests + adapters)
        run: pnpm verify

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri bundle
        run: pnpm tauri build

      # Windows code signing via SignPath Foundation (free for open source).
      # See CODE_SIGNING.md. The app exe is signed before the portable zip
      # is packed, so the zip contains the signed exe. The NSIS installer is
      # signed separately below, after the zip is built: it still embeds the
      # unsigned exe (the installer is built from the binary before signing),
      # but the file users download and run — the installer itself — is signed.
      # Gating: every signing step is skipped when SIGNPATH_API_TOKEN is not
      # configured, and the release ships unsigned, exactly as before.
      # Each signing request needs one manual approval in SignPath (the
      # release-signing policy approver gets an email). If approval does not
      # arrive within the wait timeout, or signing fails for any other reason,
      # the step is allowed to fail and the release continues with unsigned
      # files instead of blocking.
      # Detect whether SignPath signing is configured. The `secrets` context
      # cannot be referenced in `if:` conditionals (GitHub rejects the whole
      # workflow at parse time with "Unrecognized named-value: 'secrets'"),
      # so the secret presence is evaluated once here into a step output,
      # and the signing steps below gate on that output instead.
      - name: Detect SignPath configuration
        id: signpath
        shell: bash
        run: |
          if [ -n "${{ secrets.SIGNPATH_API_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload unsigned app exe for signing
        id: upload-unsigned-exe
        if: ${{ matrix.platform == 'windows' && steps.signpath.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # archive: false uploads the single exe as-is (not zipped); the
          # artifact name then defaults to the file name. SignPath needs the
          # raw exe so its artifact configuration can be a plain exe config.
          path: src-tauri/target/release/*.exe
          if-no-files-found: error
          archive: false
          retention-days: 1

      - name: Sign app exe with SignPath
        id: sign-exe
        if: ${{ matrix.platform == 'windows' && steps.signpath.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist/signed-exe
          skip-decompress: true

      - name: Replace app exe with signed copy
        if: ${{ matrix.platform == 'windows' && steps.sign-exe.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = Get-ChildItem -Path dist/signed-exe -Filter *.exe -File | Select-Object -First 1
          if (-not $signed) { throw 'No signed exe downloaded from SignPath' }
          # Verify before overwriting: a bad signature must never replace the
          # working unsigned build, and no backup file may be left inside
          # src-tauri/target/release (pack:portable zips that directory).
          $status = (Get-AuthenticodeSignature -FilePath $signed.FullName).Status
          if ($status -ne 'Valid') {
            Write-Warning "Signed app exe failed verification ($status); keeping the unsigned build."
            exit 0
          }
          $target = Get-ChildItem -Path src-tauri/target/release -Filter *.exe -File | Select-Object -First 1
          if (-not $target) { throw 'No app exe found in src-tauri/target/release' }
          Copy-Item $signed.FullName $target.FullName -Force
          Write-Host "Signed app exe verified and installed: $($target.FullName)"

      # Apple Silicon requires a valid code signature for browser-downloaded apps.
      # tauri.conf.json uses Tauri's documented ad-hoc identity (`-`) until a
      # Developer ID certificate and notarization credentials are available.
      - name: Verify macOS app signature inside DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$dmg" ]]; then
            echo "No macOS DMG found" >&2
            exit 1
          fi

          mount_dir="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_dir" -quiet >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
          app="$(find "$mount_dir" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "No .app bundle found inside $dmg" >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          printf '%s\n' "$signature"
          if ! grep -Eq '^(Signature=adhoc|Authority=Developer ID Application:)' <<<"$signature"; then
            echo "macOS app is neither ad-hoc nor Developer ID signed" >&2
            exit 1
          fi

      # Distribution policy: Windows artifacts are Authenticode-signed via
      # SignPath Foundation when SIGNPATH_API_TOKEN is configured (see
      # CODE_SIGNING.md); without it they ship unsigned, as before. macOS
      # uses ad-hoc signing. GitHub Releases is the manual update channel.

      - name: Build Windows portable zip
        if: matrix.platform == 'windows'
        run: pnpm pack:portable -- --input src-tauri/target/release --out dist/portable --name "Multi-AI-Chat-Desktop-${{ steps.version.outputs.version }}-windows-portable.zip"

      # Sign the NSIS installer itself (the file users download and run).
      # Same gating and failure behavior as the app exe above: skipped
      # without SIGNPATH_API_TOKEN, and a failed/timed-out signing request
      # leaves the unsigned installer in place instead of blocking the release.
      - name: Upload unsigned NSIS installer for signing
        id: upload-unsigned-nsis
        if: ${{ matrix.platform == 'windows' && steps.signpath.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          archive: false
          retention-days: 1

      - name: Sign NSIS installer with SignPath
        id: sign-nsis
        if: ${{ matrix.platform == 'windows' && steps.signpath.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-nsis.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: dist/signed-nsis
          skip-decompress: true

      - name: Replace NSIS installer with signed copy
        if: ${{ matrix.platform == 'windows' && steps.sign-nsis.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = Get-ChildItem -Path dist/signed-nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $signed) { throw 'No signed installer downloaded from SignPath' }
          # Verify before overwriting, same as the app exe above.
          $status = (Get-AuthenticodeSignature -FilePath $signed.FullName).Status
          if ($status -ne 'Valid') {
            Write-Warning "Signed NSIS installer failed verification ($status); keeping the unsigned build."
            exit 0
          }
          $target = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $target) { throw 'No NSIS installer found in src-tauri/target/release/bundle/nsis' }
          Copy-Item $signed.FullName $target.FullName -Force
          Write-Host "Signed NSIS installer verified and installed: $($target.FullName)"

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/portable/*.zip
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    # Fork policy: publish with whatever platform artifacts succeeded; a single
    # failed/cancelled platform build must not block the release. Only a
    # deliberately cancelled run skips publishing.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          # Fork policy: publish immediately (upstream created a draft for manual
          # review; this fork auto-publishes its own builds to Releases).
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-pre') }}
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
